# 装修记事本应用 - Nginx 配置文件
# 使用方法: sudo cp nginx-renovation.conf /etc/nginx/sites-available/renovation-notepad
# 然后: sudo ln -s /etc/nginx/sites-available/renovation-notepad /etc/nginx/sites-enabled/
# 测试配置: sudo nginx -t
# 重启 Nginx: sudo systemctl restart nginx

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name your-domain.com;  # 替换为您的域名或服务器IP

        # 前端静态文件
        location / {
            root /var/www/renovation-notepad/dist;
            try_files $uri $uri/ /index.html;
            index index.html;
        }

        # API 代理到后端
        location /api {
            proxy_pass http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
